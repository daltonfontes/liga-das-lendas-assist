name: Release

# Gera os instaladores (Windows .exe/.msi e macOS .dmg) numa Release em rascunho.
# Dispara ao enviar uma tag v* ou manualmente (Actions > Release > Run workflow).
# A tag da Release vem da versão em src-tauri/tauri.conf.json (ex.: v0.1.0) e é
# criada pelo GitHub quando o rascunho é publicado.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Liga das Lendas Assist v__VERSION__"
          releaseDraft: true
          args: ${{ matrix.args }}
